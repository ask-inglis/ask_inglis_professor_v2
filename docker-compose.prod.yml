# Production on the droplet. Run:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Needs a file named .env.prod next to this file and backend/.env.
# No ports are published. The proxy project (ask_inglis_proxy) reaches these containers over the shared "web" network.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - portal_data:/data
    restart: unless-stopped
    networks:
      default: {}
      web:
        aliases: [professor-backend]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://${PROF_API_HOST}
        VITE_BASE_PATH: /ask_inglis_professor/
    restart: unless-stopped
    networks:
      default: {}
      web:
        aliases: [professor-frontend]

volumes:
  portal_data:

networks:
  web:
    external: true